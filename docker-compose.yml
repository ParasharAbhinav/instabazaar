services:
  postgres:
    image: postgres:18-alpine
    container_name: instabazaar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instabazaar}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD must be set}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-least-privilege.sh:/docker-entrypoint-initdb.d/10-init-least-privilege.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-role-reconciler:
    image: postgres:18-alpine
    container_name: instabazaar-role-reconciler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-instabazaar}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres_admin}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD must be set}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    volumes:
      - ./docker/postgres/init-least-privilege.sh:/reconcile.sh:ro
    entrypoint: ["/bin/sh", "/reconcile.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: instabazaar-backend
    restart: unless-stopped
    depends_on:
      db-role-reconciler:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-instabazaar}
      SPRING_DATASOURCE_USERNAME: instabazaar_runtime
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
      SPRING_FLYWAY_USER: instabazaar_migrator
      SPRING_FLYWAY_PASSWORD: ${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD must be set}
      INSTABAZAAR_DATABASE_BOOTSTRAP_ENABLED: "false"
    volumes:
      - mediadata:/app/var/media
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend-proxy:
    build:
      context: ./frontend
    container_name: instabazaar-proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"

volumes:
  pgdata:
  mediadata: