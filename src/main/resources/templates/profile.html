<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Your profile')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main id="main" class="shell section-space narrow"><p class="eyebrow">YOUR LITTLE CORNER</p><h1 class="page-title">Make it <em>yours.</em></h1><a class="editorial-link" th:href="@{/account}">← Back to your account</a><form class="form-panel mt-4" th:action="@{/profile}" th:object="${form}" method="post"><div th:replace="~{fragments/layout :: errors}"></div><label for="displayName">Your name</label><input id="displayName" name="displayName" th:value="${form.displayName}" maxlength="80" required autocomplete="name"><label for="email">Email address</label><input id="email" name="email" type="email" th:value="${form.email}" maxlength="190" required autocomplete="email"><p class="field-help">Your email is private unless you add a public contact email to your storefront. Your account role cannot be changed here.</p><button class="button" type="submit">Save profile ↗</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
