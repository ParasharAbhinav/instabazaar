<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Your saved finds')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main id="main" class="shell section-space"><p class="eyebrow">KEPT CLOSE, NOT FORGOTTEN</p><div class="section-heading"><h1 class="page-title">Your saved <em>finds.</em></h1><a th:href="@{/profile}" class="editorial-link">Edit your profile ↗</a></div><p class="page-intro">A little collection of things that caught your eye. Listings may change or become unavailable.</p><div class="product-grid" th:unless="${#lists.isEmpty(products)}"><div th:each="product : ${products}"><article th:replace="~{fragments/cards :: product(${product})}"></article><form th:action="@{/wishlist/{id}/remove(id=${product.id})}" method="post" class="mt-3"><button type="submit" class="text-button">Remove from wishlist</button></form></div></div><th:block th:if="${#lists.isEmpty(products)}"><div th:replace="~{fragments/cards :: empty('A little empty, a lot of possibility.', 'Save a product while exploring and you can find it here, without another long scroll.')}"></div></th:block></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
