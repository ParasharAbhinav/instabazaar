<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Contact the seller')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main id="main" class="shell section-space narrow"><p class="eyebrow">A QUICK HEADS-UP</p><h1 class="page-title">You’re leaving<br><em>InstaBazaar.</em></h1><div class="form-panel"><p>You’re about to contact <strong th:text="${store.storeName}"></strong> on <span th:text="${platform}"></span>.</p><p>Seller identity and external transactions are not verified by InstaBazaar. Confirm pricing, availability, shipping, and payment arrangements with the seller.</p><p class="external-destination" th:text="${destination}"></p><a th:href="${destination}" target="_blank" rel="noopener noreferrer nofollow" class="button">Continue to seller ↗</a><a th:href="@{/sellers/{id}(id=${store.id})}" class="button button-outline">Go back</a></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
