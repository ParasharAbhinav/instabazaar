<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Moderate products')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main id="main" class="shell section-space"><p class="eyebrow">ADMINISTRATION</p><h1 class="page-title">A thoughtful <em>catalogue.</em></h1><nav th:replace="~{fragments/layout :: admin-nav}"></nav><div class="table-responsive"><table class="workspace-table"><thead><tr><th scope="col">Product</th><th scope="col">Seller</th><th scope="col">Listing status</th><th scope="col">Moderation</th><th scope="col">Action</th></tr></thead><tbody><tr th:each="product : ${products}"><td><strong th:text="${product.title}"></strong><small th:text="${product.description}"></small></td><td th:text="${product.storeName}"></td><td th:text="${product.status}"></td><td th:text="${product.hidden} ? 'Hidden' : 'Not hidden'"></td><td><form th:action="@{/admin/products/{id}/visibility(id=${product.id})}" method="post" data-confirm="Change public visibility for this listing?"><input type="hidden" name="hidden" th:value="${!product.hidden}"><label class="checkbox-label"><input type="checkbox" name="confirm" value="true" required> Confirm</label><button type="submit" class="text-button" th:text="${product.hidden} ? 'Restore visibility' : 'Hide listing'"></button></form></td></tr><tr th:if="${#lists.isEmpty(products)}"><td colspan="5">No products on this page.</td></tr></tbody></table></div><nav class="pagination-bar" aria-label="Moderation pages"><a th:if="${page > 0}" th:href="@{/admin/products(page=${page - 1})}">← Previous</a><span th:text="'Page ' + (${page} + 1)"></span><a th:if="${#lists.size(products) == 20}" th:href="@{/admin/products(page=${page + 1})}">Next →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
