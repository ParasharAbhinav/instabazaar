<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Manage accounts')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main id="main" class="shell section-space"><p class="eyebrow">ADMINISTRATION</p><h1 class="page-title">People &amp; <em>storekeepers.</em></h1><nav th:replace="~{fragments/layout :: admin-nav}"></nav><div class="table-responsive"><table class="workspace-table"><thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Role</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead><tbody><tr th:each="user : ${users}"><td><strong th:text="${user.displayName}"></strong><small th:if="${user.demo}">Demo account</small></td><td th:text="${user.email}"></td><td th:text="${user.role}"></td><td th:text="${user.active} ? 'Active' : 'Inactive'"></td><td><form th:if="${user.role.name() != 'ADMIN'}" th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post" data-confirm="Change this account’s access? Seller products may be removed from public discovery."><input name="active" type="hidden" th:value="${!user.active}"><label class="checkbox-label"><input type="checkbox" name="confirm" value="true" required> Confirm</label><button type="submit" class="text-button" th:text="${user.active} ? 'Deactivate' : 'Reactivate'"></button></form><span th:if="${user.role.name() == 'ADMIN'}">Protected admin</span></td></tr></tbody></table></div><nav class="pagination-bar" aria-label="Account pages"><a th:if="${page > 0}" th:href="@{/admin/users(page=${page - 1})}">← Previous</a><span th:text="'Page ' + (${page} + 1)"></span><a th:if="${#lists.size(users) == 20}" th:href="@{/admin/users(page=${page + 1})}">Next →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
