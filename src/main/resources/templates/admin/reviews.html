<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Moderate reviews')}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main id="main" class="shell section-space"><p class="eyebrow">ADMINISTRATION</p><h1 class="page-title">Keep the conversation <em>honest.</em></h1><nav th:replace="~{fragments/layout :: admin-nav}"></nav><div class="table-responsive"><table class="workspace-table"><thead><tr><th scope="col">Review</th><th scope="col">Product / author</th><th scope="col">Rating</th><th scope="col">Visibility</th><th scope="col">Action</th></tr></thead><tbody><tr th:each="review : ${reviews}"><td th:text="${review.text}"></td><td><strong th:text="${review.productTitle}"></strong><small th:text="${review.displayName}"></small></td><td th:text="${review.rating} + ' / 5'"></td><td th:text="${review.hidden} ? 'Hidden' : 'Visible if author active'"></td><td><form th:action="@{/admin/reviews/{id}/visibility(id=${review.id})}" method="post" data-confirm="Change visibility for this review? Public ratings will be recalculated."><input type="hidden" name="hidden" th:value="${!review.hidden}"><label class="checkbox-label"><input type="checkbox" name="confirm" value="true" required> Confirm</label><button type="submit" class="text-button" th:text="${review.hidden} ? 'Restore review' : 'Hide review'"></button></form></td></tr><tr th:if="${#lists.isEmpty(reviews)}"><td colspan="5">No reviews on this page. We never generate fake reviews.</td></tr></tbody></table></div><nav class="pagination-bar" aria-label="Review pages"><a th:if="${page > 0}" th:href="@{/admin/reviews(page=${page - 1})}">← Previous</a><span th:text="'Page ' + (${page} + 1)"></span><a th:if="${#lists.size(reviews) == 20}" th:href="@{/admin/reviews(page=${page + 1})}">Next →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
