spring.application.name=InstaBazaar
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/instabazaar?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:instabazaar}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
instabazaar.storage-path=${UPLOAD_DIR:./uploads}
instabazaar.seed-demo=false
instabazaar.demo-password=${DEMO_PASSWORD:}
instabazaar.admin-email=${ADMIN_EMAIL:}
instabazaar.admin-password=${ADMIN_PASSWORD:}
spring.thymeleaf.cache=true
