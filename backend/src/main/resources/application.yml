spring:
  application:
    name: instabazaar
  jackson:
    parser:
      strict-duplicate-detection: true
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 0
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/instabazaar}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 5
        tcpKeepAlive: true
  jdbc:
    template:
      query-timeout: 3s
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    user: ${SPRING_FLYWAY_USER:${spring.datasource.username}}
    password: ${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
server:
  address: 0.0.0.0
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

instabazaar:
  web:
    allowed-origins: ${SPA_ALLOWED_ORIGINS:http://localhost:5173}
