name: InstaBazaar CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: instabazaar
          POSTGRES_USER: instabazaar_ci
          POSTGRES_PASSWORD: ${{ github.run_id }}_ephemeral_db_key
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U instabazaar_ci -d instabazaar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run Flyway & Full Backend Integration Suite
        working-directory: ./backend
        env:
          INSTA_INTEGRATION_TEST: "true"
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/instabazaar
          TEST_DB_USERNAME: instabazaar_ci
          TEST_DB_PASSWORD: ${{ github.run_id }}_ephemeral_db_key
          SPRING_FLYWAY_USER: instabazaar_ci
          SPRING_FLYWAY_PASSWORD: ${{ github.run_id }}_ephemeral_db_key
        # ZIP downloads do not retain the Unix executable bit.
        # Keep the wrapper runnable for a fresh GitHub upload.
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Audit, Test, and Build Production Frontend
        working-directory: ./frontend
        env:
          VITE_DEMO_MODE: "false"
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build

  compose-stack-verify:
    runs-on: ubuntu-latest
    needs: [ backend-verify, frontend-verify ]
    steps:
      - uses: actions/checkout@v4
      - name: Boot Full Docker Compose Stack & Verify TLS Certificate + Health
        run: |
          export POSTGRES_DB=instabazaar
          export POSTGRES_SUPERUSER=postgres_admin
          export POSTGRES_SUPERUSER_PASSWORD="$(openssl rand -hex 24)"
          export MIGRATOR_DB_PASSWORD="$(openssl rand -hex 24)"
          export APP_DB_PASSWORD="$(openssl rand -hex 24)"
          docker compose up -d --build --wait
          docker compose ps
          docker cp instabazaar-proxy:/etc/nginx/certs/server.crt /tmp/proxy-ca.crt
          curl --cacert /tmp/proxy-ca.crt --resolve localhost:443:127.0.0.1 -f https://localhost/api/v1/health
      - name: Stop disposable stack
        if: always()
        env:
          POSTGRES_SUPERUSER_PASSWORD: cleanup-placeholder
          MIGRATOR_DB_PASSWORD: cleanup-placeholder
          APP_DB_PASSWORD: cleanup-placeholder
        run: docker compose down -v
